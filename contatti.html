<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logoCLF.png" type="image/png">

    <title>Contatti - Charly's Little Friends</title>
</head>
<body>
    <div id="header" data-active="contatti"></div>

    <main>

        <!-- CARD: Presentazione -->
        <section>
            <h1>Contattami</h1>
            <p>
                Ciao, sono Charly: creo amigurumi all'uncinetto fatti a mano, piccoli pupazzetti pensati per
                regalare un sorriso. Se hai domande, richieste personalizzate o vuoi ordinare un pezzo unico,
                scrivimi qui sotto.
            </p>
        </section>

        <!-- SEZIONE DUE COLONNE -->
        <section class="contact-columns">

            <!-- COLONNA SINISTRA: MAPPA -->
            <div class="contact-map">
                <h2>Mi trovo qui</h2>

                <!-- Google Maps embed Aosta -->
                <div class="map-wrapper">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2796.508932253889!2d7.315167315868948!3d45.73750297910402!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4788e6f8f1f0e3c1%3A0xdea5b0e5a8b1c2d!2sAosta%2C%20AO!5e0!3m2!1sit!2sit!4v1697040000000"
                            loading="lazy"
                            allowfullscreen
                            referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>


                <p>Mi trovo ad Aosta, Italia.</p>
            </div>

            <div id="form" data-subject="Contatto"></div>


        </section>

    </main>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/common.js"></script>
    <script src="js/selectedPage.js"></script>
    <script src="js/selectedForm.js"></script>
    <script src="js/formValidation.js"></script>
</body>
</html>
