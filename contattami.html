<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logoCLF.png" type="image/png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XVTWH6LQ6V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XVTWH6LQ6V');
    </script>

    <title>Contatti - Charly's Little Friends</title>
</head>
<body>
    <div id="header"></div>
    <main>

        <!-- CARD SINISTRA: Riepilogo -->
        <section id="item-summary" class="contact-map">
            <h1>Contattami</h1>
            <p id="summary-text">Caricamento dati...</p>
        </section>

        <!-- CARD DESTRA: Form -->
        <div id="form" data-subject="Richiesta Acquisto"></div>

    </main>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/common.js"></script>
    <script type="module">
        import { initItemSummary } from "./js/contactDetail.js";

        fetch("./components/form.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("form").innerHTML = html;

                // ORA il form esiste → posso eseguire lo script
                initItemSummary();
            });
    </script>
    <script src="js/formValidation.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
