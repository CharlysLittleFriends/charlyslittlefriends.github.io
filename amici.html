<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logoCLF.png" type="image/png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XVTWH6LQ6V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XVTWH6LQ6V');
    </script>

    <title>Amici - Charly's Little Friends</title>
</head>
<body>
    <div id="header" data-active="amici"></div>

    <main>
        <div class="filters-title">
            <h1>Filtra i tuoi Amici</h1>
            <p>Seleziona Tipologia, Dimensione e Colore per restringere la lista.</p>
        </div>

        <!-- FILTRI -->
        <div class="filters" aria-label="Filtri">
            <div class="filter-group">
                <label for="filter-type">Tipologia</label>
                <select id="filter-type">
                    <option value="">Tutti</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-dim">Dimensione</label>
                <select id="filter-dim">
                    <option value="">Tutte</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-colors">Colore</label>
                <select id="filter-colors">
                    <option value="">Tutti</option>
                </select>
            </div>
        </div>


        <!-- GRID CARDS -->
        <section id="cards-section" aria-label="Catalogo pupazzetti">
            <div id="cards-container" aria-live="polite"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="js/common.js"></script>
    <script src="js/googleIntegration.js"></script>
    <script src="js/selectedPage.js"></script>
    <script type="module">
        import { initFilters } from "./js/filtersResponsive.js";
        window.addEventListener("googleDataReady", () => {
            initFilters(window.allRows, window.renderCards);
        });
    </script>
</body>
</html>
